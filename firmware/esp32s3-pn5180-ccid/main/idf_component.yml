# Managed dependencies（idf.py reconfigure / build 時に取得される）。
# esp_tinyusb は USB スタック、pn5180 は NFC reader ドライバ。
# 版は実機で確かめた組み合わせ（ESP-IDF v5.3.5 + esp_tinyusb 1.7.6 + tinyusb 0.19.0, 2026-06〜09）に固定する。
# 店舗 PC 2026-10-07: 指定なしだと tinyusb 0.21.0 が入り、usbd_edpt_xfer の引数が増えていて（is_isr）
# ccid_device.c がビルドできなかった。版を上げるときは実機で CCID の列挙と読み取りを確かめてから。
dependencies:
  idf: ">=5.1"
  # USB device スタック（TinyUSB を ESP-IDF から使う公式ラッパ）。
  esp_tinyusb: "~1.7.6"
  # TinyUSB 本体（esp_tinyusb の依存）。0.21 で usbd_edpt_xfer に is_isr の引数が増えた。
  espressif/tinyusb: "~0.19.0"
  # PN5180 ドライバ（ISO14443A + ISO15693。get_all_uids で UID 列挙）。
  # ⚠ レジストリ名は jef-sure/pn5180（GitHub repo 名 esp32-component-pn5180 とは別）。
  # https://components.espressif.com/components/jef-sure/pn5180
  jef-sure/pn5180: "^0.1.0"

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        # core(faster-whisper/pyaudio/customtkinter) は lazy import でテスト不要。
        # numpy/pokerkit/jsonschema を入れて importorskip skip を 0 にする。
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff — 実バグ系 F/E9 の最小ゲート, 設定は pyproject.toml)
        run: ruff check .

      - name: Run tests (vision レガシーは除外、skip 0 が前提)
        run: pytest tests/ -v --ignore=tests/test_vision.py

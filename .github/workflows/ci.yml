name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # クラウドの保存（cloud/postgres.py, ADR-0067）の試験に使う Postgres。無ければその試験は飛ばす（手元）
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POKERAPP_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        # core(faster-whisper/pyaudio/customtkinter) は lazy import でテスト不要。
        # numpy/pokerkit/jsonschema を入れて importorskip skip を 0 にする。
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff — 実バグ系 F/E9 の最小ゲート, 設定は pyproject.toml)
        run: ruff check .

      - name: Run tests (vision レガシーは除外、skip 0 が前提)
        run: pytest tests/ -v --ignore=tests/test_vision.py

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pokerapp"
version = "1.0.0.dev0"
description = "ライブポーカーのハンド履歴を音声(faster-whisper)＋RFID(PN5180+ESP32-S3, PC/SC)から自動記録し JSON/PHH 出力するアプリ"
readme = "README.md"
requires-python = ">=3.11"

# ── core runtime（製品が動くのに必須）──
# vision 系(opencv-python/easyocr)は廃止予定のため core から除外（[vision] extra に分離）。
dependencies = [
    "numpy>=1.24,<3",
    "pokerkit>=0.7.0,<0.8.0",
    "faster-whisper>=1.0,<2",
    "pyaudio>=0.2.13,<0.3",
    "customtkinter>=5.2,<6",
]

[project.optional-dependencies]
# RFID を PC/SC で直接読む場合のみ（transport="pcsc"）
pcsc = ["pyscard>=2.0.7,<3"]
# 廃止予定の vision/ レガシー（製品依存外。必要時のみ）
vision = ["opencv-python>=4.8,<5", "easyocr>=1.7,<2"]
# player 向け read-only viewer API（M1, ADR-0017。必要時のみ）。
# httpx は viewer API の Python client（api/client.py, S5/ADR-0020）用。
api = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1", "httpx>=0.27,<1"]
# 第 2 の耳（日本語専用の音声認識 ReazonSpeech の ONNX 版, audio/second_ear.py）。聞き直しの測定
# （tools/second_ear.py）に使う。モデルは初回に models/ へ取得する
ear = ["kaldi-native-fbank>=1.20,<2", "onnxruntime>=1.14,<2"]
# 開発/テスト/契約検証（CI が使用。実行時 core には不要）
dev = ["pytest>=7.0", "pytest-xdist>=3.5,<4", "pytest-timeout>=2.3,<3", "jsonschema>=4.0,<5", "fastapi>=0.110,<1", "httpx>=0.27,<1"]

[project.scripts]
pokerapp = "main:main"

[tool.setuptools]
# vision / tests / tools / docs は配布パッケージから除外
packages = ["core", "audio", "rfid", "integration", "output", "gui", "api"]
py-modules = ["main"]

[tool.setuptools.package-data]
# お客さん向け画面のビルド（viewer API が `/` で配信する, ADR-0059）
api = ["static/player/*", "static/player/**/*"]

[tool.pytest.ini_options]
# テストのダイエット（docs/worklog/2026-10-06-test-diet.md, 監査 1 D12）: 遅いテストに印を付けて、変更ごとに回す速い組
# （`pytest -m "not slow" -n auto`）と遅い組を分ける。CI は 2 ジョブで両方を回す。遅いテストが増えたら
# `--durations` の表で見える。
testpaths = ["tests"]
markers = [
    "slow: 単独で 2 秒を超えるテスト（推定器の店舗のハンドなど）。速い組（-m \"not slow\"）では回さない",
]
addopts = "--strict-markers --durations=15 --durations-min=1.0"
# pytest-timeout（requirements-dev）: 速い組で 20 秒を超えたら落として知らせる。slow の印のテストは 300 秒
timeout = 20

[tool.ruff]
target-version = "py311"
# vision/ はレガシー（CI のテスト対象からも除外済み）
extend-exclude = ["vision"]

[tool.ruff.lint]
# 最小ゲート: 実バグ系のみ（pyflakes F + 構文エラー E9）。
# スタイル系 (E/W ほか) は別タスクで段階導入する。
select = ["F", "E9"]
